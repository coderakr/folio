name: Build and release APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag for a signed release (e.g. v1.5); leave blank for a debug APK'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: apk-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  debug:
    name: Build debug APK
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.tag == '')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;37.0.0'

      - uses: gradle/actions/setup-gradle@v6

      - name: Check and build debug APK
        run: ./gradlew --no-daemon :app:test :app:lintDebug :app:assembleDebug

      - uses: actions/upload-artifact@v7
        with:
          name: folio-debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Explain downloads
        run: |
          echo 'Download the debug APK from the Artifacts section of this run.' >> "$GITHUB_STEP_SUMMARY"
          echo 'For a signed GitHub Release, configure the four signing secrets in README and push a matching version tag.' >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build signed release APK
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) || (github.event_name == 'workflow_dispatch' && inputs.tag != '')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Validate version tag
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo '::error::Use a version tag such as v1.5 or v1.5.1.'
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          persist-credentials: false

      - name: Prepare signing key
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=false
          for secret in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [[ -z "${!secret}" ]]; then
              echo "::error::Missing repository Actions secret: $secret. See README release setup."
              missing=true
            fi
          done
          if [[ "$missing" == true ]]; then
            echo "::error::Add all four secrets at https://github.com/$GITHUB_REPOSITORY/settings/secrets/actions. For a build without signing secrets, push to main or run manually with the tag blank."
            exit 1
          fi
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/folio-release.jks"

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;37.0.0'

      - uses: gradle/actions/setup-gradle@v6

      - name: Check and build signed release
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/folio-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon --no-configuration-cache :app:test :app:lintRelease :app:assembleRelease

      - name: Verify APK and prepare downloads
        shell: bash
        run: |
          version=$(jq -r '.elements[0].versionName' app/build/outputs/apk/release/output-metadata.json)
          if [[ "$RELEASE_TAG" != "v$version" ]]; then
            echo "::error::Tag $RELEASE_TAG must match app versionName v$version."
            exit 1
          fi
          apk=app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --verbose "$apk"
          mkdir -p dist
          cp "$apk" "dist/folio-$RELEASE_TAG.apk"
          cd dist
          sha256sum "folio-$RELEASE_TAG.apk" > "folio-$RELEASE_TAG.apk.sha256"

      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/folio-release.jks"

      - uses: actions/upload-artifact@v7
        with:
          name: release-apk
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-apk
          path: dist

      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          cd dist
          sha256sum --check "folio-$RELEASE_TAG.apk.sha256"
          if draft=$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft'); then
            if [[ "$draft" == false ]]; then
              echo "Release $RELEASE_TAG is already published; leaving its downloads unchanged."
              exit 0
            fi
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "Folio $RELEASE_TAG" --generate-notes
          fi
          gh release upload "$RELEASE_TAG" "folio-$RELEASE_TAG.apk" "folio-$RELEASE_TAG.apk.sha256" --clobber
          gh release edit "$RELEASE_TAG" --draft=false
